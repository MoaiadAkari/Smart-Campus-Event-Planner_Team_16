<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Recovery · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/components/header.css">
  <link rel="stylesheet" href="../public/css/components/footer.css">
  <script src="../public/js/components.js" defer></script>
  <script src="../public/js/auth.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Recover your account</h1>
      <p class="subtitle">Confirm your email and security question to choose a new password.</p>

      <div id="form-banner" class="form-banner" role="status" aria-live="polite"></div>

      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@live.concordia.ca" autocomplete="email">
          <p id="email-error" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="security-question">Security question</label>
          <select id="security-question" name="securityQuestion">
            <option value="">Select your security question</option>
            <option value="What city were you born in?">What city were you born in?</option>
            <option value="What was the name of your first school?">What was the name of your first school?</option>
          </select>
          <p id="security-question-error" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="security-answer">Security answer</label>
          <input id="security-answer" name="securityAnswer" type="text" placeholder="Enter your answer" autocomplete="off">
          <p id="security-answer-error" class="error-message"></p>
        </div>

        <button type="submit" class="btn">Verify Account</button>
      </form>

      <p class="auth-switch">Remembered your password? <a href="login.html">Back to login</a></p>
    </div>
  </main>

  <div id="footer-container"></div>
</body>
</html>
