<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">

  <link rel="stylesheet" href="../public/css/components/header.css">
  <link rel="stylesheet" href="../public/css/components/footer.css">
  <script src="../public/js/components.js" defer></script>

</head>
<body>

  <div id="header-container"></div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your account email and we'll send password reset instructions.</p>

      <div id="form-banner" class="form-banner" role="status" aria-live="polite"></div>

      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@live.concordia.ca"
            autocomplete="email"
            required
          >
          <p class="error-message" id="email-error"></p>
        </div>

        <button type="submit" class="btn" id="forgot-submit">Send Reset Instructions</button>
      </form>

      <a id="demo-reset-link" class="demo-reset-link" href="reset-password.html" hidden>
        Open demo reset page
      </a>

      <p class="auth-switch">
        Remembered your password? <a href="login.html">Back to login</a>
      </p>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../public/js/auth.js"></script>
</body>
</html>
