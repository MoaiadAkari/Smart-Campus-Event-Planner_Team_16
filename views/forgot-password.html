<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html">Smart Campus Event Planner</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">About / Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><a href="register.html">Sign Up</a></li>
    </ul>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your account email and we'll send password reset instructions.</p>

      <div id="form-banner" class="form-banner" role="status" aria-live="polite"></div>

      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@live.concordia.ca"
            autocomplete="email"
            required
          >
          <p class="error-message" id="email-error"></p>
        </div>

        <button type="submit" class="btn" id="forgot-submit">Send Reset Instructions</button>
      </form>

      <a id="demo-reset-link" class="demo-reset-link" href="reset-password.html" hidden>
        Open demo reset page
      </a>

      <p class="auth-switch">
        Remembered your password? <a href="login.html">Back to login</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>SOEN 287 · Smart Campus Event Planner · Summer 2026</p>
  </footer>

  <script src="../public/js/auth.js"></script>
</body>
</html>
