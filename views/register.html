<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/components/header.css">
  <link rel="stylesheet" href="../public/css/components/footer.css">
  <script src="../public/js/components.js" defer></script>
  <script src="../public/js/auth.js" defer></script>
</head>
<body>

  <div id="header-container"></div>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Join to discover and register for campus events.</p>

      <div id="form-banner" class="form-banner"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="fullName" placeholder="e.g. Erik Dahan" required>
          <p class="error-message" id="full-name-error"></p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@live.concordia.ca" required>
          <p class="error-message" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
          <p class="hint">Minimum 8 characters.</p>
          <p class="error-message" id="password-error"></p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Re-enter your password" required>
          <p class="error-message" id="confirm-password-error"></p>
        </div>

        <div class="form-group">
          <label for="security-question">Security question</label>
          <select id="security-question" name="securityQuestion" required>
            <option value="">Select a security question</option>
            <option value="What city were you born in?">What city were you born in?</option>
            <option value="What was the name of your first school?">What was the name of your first school?</option>
          </select>
          <p class="error-message" id="security-question-error"></p>
        </div>

        <div class="form-group">
          <label for="security-answer">Security answer</label>
          <input type="text" id="security-answer" name="securityAnswer" placeholder="Enter an answer you will remember" autocomplete="off" required>
          <p class="hint">This answer is securely stored and used only for account recovery.</p>
          <p class="error-message" id="security-answer-error"></p>
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <div id="footer-container"></div>
</body>
</html>
