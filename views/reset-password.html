<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html">Smart Campus Event Planner</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">About / Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><a href="register.html">Sign Up</a></li>
    </ul>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="subtitle">Enter and confirm the new password for your account.</p>

      <div id="form-banner" class="form-banner" role="status" aria-live="polite"></div>

      <form id="reset-password-form" novalidate>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input
            type="password"
            id="new-password"
            name="newPassword"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            required
          >
          <p class="hint">Minimum 8 characters.</p>
          <p class="error-message" id="new-password-error"></p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm new password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Re-enter your new password"
            autocomplete="new-password"
            required
          >
          <p class="error-message" id="confirm-password-error"></p>
        </div>

        <button type="submit" class="btn" id="reset-submit">Update Password</button>
      </form>

      <p class="auth-switch">
        Return to <a href="login.html">login</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>SOEN 287 · Smart Campus Event Planner · Summer 2026</p>
  </footer>

  <script src="../public/js/auth.js"></script>
</body>
</html>
