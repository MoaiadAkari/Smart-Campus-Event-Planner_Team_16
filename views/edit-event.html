<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event | Smart Campus</title>
  <link rel="stylesheet" href="../public/css/components/header.css">
  <link rel="stylesheet" href="../public/css/components/footer.css">
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/admin-events.css">
  <script src="../public/js/components.js" defer></script>
  <script src="../public/js/mock-events.js" defer></script>
  <script src="../public/js/admin-events.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main class="admin-page">
    <header class="admin-page-heading">
      <div>
        <p class="admin-page-label">Event Management</p>
        <h1 id="event-form-title">Edit Event</h1>
        <p>Update the selected event information.</p>
      </div>
      <a class="admin-link-button secondary" href="manage-events.html">Back to Manage Events</a>
    </header>

    <div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div>

    <section class="admin-form-card">
      <form id="event-form" novalidate>
        <div class="admin-form-grid">
          <div class="form-group full-width">
            <label for="title">Event title</label>
            <input id="title" name="title" type="text" maxlength="100" autocomplete="off">
            <p id="title-error" class="error-message"></p>
          </div>

          <div class="form-group full-width">
            <label for="description">Description</label>
            <textarea id="description" name="description" maxlength="600"></textarea>
            <p id="description-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
            </select>
            <p id="category-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input id="location" name="location" type="text" maxlength="120" autocomplete="off">
            <p id="location-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="event-date">Event date</label>
            <input id="event-date" name="eventDate" type="date">
            <p id="event-date-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="capacity">Capacity</label>
            <input id="capacity" name="capacity" type="number" min="1" max="10000" step="1">
            <p id="capacity-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="start-time">Start time</label>
            <input id="start-time" name="startTime" type="time">
            <p id="start-time-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="end-time">End time</label>
            <input id="end-time" name="endTime" type="time">
            <p id="end-time-error" class="error-message"></p>
          </div>
        </div>

        <div class="admin-form-actions">
          <a class="admin-link-button secondary" href="manage-events.html">Cancel</a>
          <button id="event-submit" class="admin-action-button" type="submit">Save Changes</button>
        </div>
      </form>
    </section>
  </main>

  <div id="footer-container"></div>
</body>
</html>
