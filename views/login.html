<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Smart Campus Event Planner</title>
  <link rel="stylesheet" href="../public/css/style.css">

    <link rel="stylesheet" href="../public/css/components/header.css">
    <link rel="stylesheet" href="../public/css/components/footer.css">
    <script src="../public/js/components.js" defer></script>

    <script src="../public/js/users.js" defer></script>
    <script src="../public/js/auth.js" defer></script>

</head>
<body>

 <div id="header-container"></div>  

  <main class="auth-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your campus events.</p>

      <!-- Banner for form-level errors (e.g. wrong credentials) -->
      <div id="form-banner" class="form-banner"></div>

      <!-- novalidate: we handle validation ourselves in auth.js -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@live.concordia.ca" required>
          <p class="error-message" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>
          <p class="error-message" id="password-error"></p>
        </div>

        <p class="forgot-password">
          <a href="forgot-password.html">Forgot password?</a>
        </p>

        <button type="submit" class="btn">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Sign up</a>
      </p>
    </div>
  </main>

  <script src="../public/js/auth.js"></script>

  <div id="footer-container"></div>
</body>
</html>
